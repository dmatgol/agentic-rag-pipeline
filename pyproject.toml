[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyTorch 2.2.x (Intel macOS wheel) is built against NumPy 1.x; NumPy 2 breaks torch import.
    "numpy>=1.26,<2",
    "fastembed>=0.7.4",
    "langchain-text-splitters>=1.1.2",
    "llama-cloud>=2.4.1",
    "llama-parse>=0.5.20",
    "ollama>=0.6.2",
    "pymupdf>=1.27.2.3",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.4.1",
    "openai>=2.34.0",
    "langgraph>=1.1.10",
    "pydantic-settings>=2.14.0",
    "streamlit>=1.57.0",
    "python-dotenv>=1.2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["settings", "main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent", "indexing", "ingestion"]

# Require wheels for Intel macOS so uv does not resolve to PyTorch (etc.) releases
# that only publish arm64 macOS wheels.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Include when you lock/sync in Linux Docker too (resolution must satisfy both):
    # "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Intel macOS resolves torch 2.2.x; transformers 5.x expects torch >= 2.4 and breaks imports.
constraint-dependencies = ["transformers>=4.41,<5"]
